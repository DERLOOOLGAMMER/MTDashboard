<div class="nextBdaylWidget">
  <div class="nextBdaylWidget-heading">
    Nächste Geburtstage
  </div>

  <div class="nextBdaylWidget-birthdays">
    @for (
      birthday of dashboardData.birthdays();
      track birthday.name
    ) {
      <div class="nextBdaylWidget-birthday">
        <div class="nextBdaylWidget-birthday-avatar">
          {{ birthday.initials }}
        </div>

        <div class="nextBdaylWidget-birthday-content">
          <div class="nextBdaylWidget-birthday-name">
            {{ birthday.name }}
          </div>

          <div class="nextBdaylWidget-birthday-date">
            {{ birthday.date }}
          </div>
        </div>

        <div
          class="nextBdaylWidget-birthday-icon"
          aria-hidden="true"
        >
          🎂
        </div>
      </div>
    }
  </div>
</div>
