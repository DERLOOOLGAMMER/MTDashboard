<div class="kontaktelWidget">
  <div class="kontaktelWidget-heading">
    Kontaktbuch
  </div>

  <div class="kontaktelWidget-search">
    <span
      class="kontaktelWidget-search-icon"
      aria-hidden="true"
    >
      ⌕
    </span>

    <input
      class="kontaktelWidget-search-input"
      type="search"
      placeholder="Kontakt suchen ..."
      aria-label="Kontakt suchen"
      [value]="dashboardData.searchTerm()"
      (input)="dashboardData.updateSearchTerm($any($event.target).value)"
    >
  </div>

  <div class="kontaktelWidget-contacts">
    @for (
      contact of dashboardData.filteredContacts();
      track contact.email
    ) {
      <a
        class="kontaktelWidget-contact"
        [href]="'mailto:' + contact.email"
      >
        <span class="kontaktelWidget-contact-avatar">
          {{ contact.initials }}
        </span>

        <span class="kontaktelWidget-contact-content">
          <span class="kontaktelWidget-contact-name">
            {{ contact.name }}
          </span>

          <span class="kontaktelWidget-contact-info">
            {{ contact.department }}

            @if (contact.extension) {
              · {{ contact.extension }}
            }
          </span>
        </span>

        <span
          class="kontaktelWidget-contact-icon"
          aria-hidden="true"
        >
          ✉
        </span>
      </a>
    }
  </div>

  @if (dashboardData.filteredContacts().length === 0) {
    <div class="kontaktelWidget-no-results">
      Keine Kontakte gefunden.
    </div>
  }
</div>
