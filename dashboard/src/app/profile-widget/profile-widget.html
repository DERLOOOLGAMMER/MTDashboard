<div class="profilsWidget">
  <div class="profilsWidget-heading">
    Kontakt
  </div>

  <div class="profilsWidget-name">
    {{ dashboardData.profile().name }}
  </div>

  <div class="profilsWidget-data">
    <div class="profilsWidget-data-row">
      <span class="profilsWidget-label">
        Telefon
      </span>

      <a
        class="profilsWidget-value"
        [href]="'tel:' + dashboardData.profile().phone">
        {{ dashboardData.profile().phone }}
      </a>
    </div>

    <div class="profilsWidget-data-row">
      <span class="profilsWidget-label">
        E-Mail
      </span>

      <a
        class="profilsWidget-value"
        [href]="'mailto:' + dashboardData.profile().email">
        {{ dashboardData.profile().email }}
      </a>
    </div>
  </div>
</div>
